name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm turbo typecheck

      - name: Unit tests (shared)
        run: pnpm --filter @planazo/shared test

      - name: Component tests (mobile)
        run: pnpm --filter mobile test -- --ci

      # Catches what typecheck can't: bad CSS module references, missing
      # font/metadata config, anything that only fails at render time.
      - name: Build landing page (web)
        run: pnpm turbo build --filter=web

  migrations:
    name: DB migrations + integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Pinned, not latest: newer CLIs (2.110.0 observed) create the local DB
      # without table grants for anon/authenticated/service_role, so every
      # API query fails with "permission denied for table". 2.90.0 matches
      # the locally verified behavior.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.90.0

      # Full stack, not `db start`: the integration tests sign up real users,
      # so auth (and the REST API) must be up. Migrations apply on start.
      - name: Start local Supabase and apply all migrations
        run: supabase start

      - name: Integration tests (RLS, RPCs, triggers)
        run: pnpm --filter @planazo/integration-tests test

  deploy:
    name: Push migrations to production
    runs-on: ubuntu-latest
    # Merges to main only, and only after the same commit passed every test —
    # this is the one automated writer production has.
    needs: [checks, migrations]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.90.0

      # The access token alone is enough: link mints a login role for the
      # session pooler, no database password required (verified in a clean
      # container). `db push` applies only migrations missing from the remote
      # history table, so re-runs are no-ops.
      - name: Link to production
        run: supabase link --project-ref leszgvpjonzjclhbgzju

      - name: Push migrations
        run: supabase db push --yes
