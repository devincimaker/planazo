name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm turbo typecheck

      - name: Unit tests (shared)
        run: pnpm --filter @planazo/shared test

      - name: Component tests (mobile)
        run: pnpm --filter mobile test -- --ci

      # Catches what typecheck can't: bad CSS module references, missing
      # font/metadata config, anything that only fails at render time.
      - name: Build landing page (web)
        run: pnpm turbo build --filter=web

  migrations:
    name: DB migrations + integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `db push` matches migrations to the remote history table by version
      # timestamp, so editing a file that production has already applied is
      # SILENTLY skipped at deploy — CI's fresh stack would test the edit,
      # production would never receive it, and the two diverge without a single
      # red signal. Migrations that exist on the base branch are therefore
      # immutable: fix forward with a new migration. The branch's own new
      # migrations stay freely editable.
      - name: Migrations on the base branch are immutable
        if: github.event_name == 'pull_request'
        run: |
          git fetch --quiet --depth=1 origin "${{ github.event.pull_request.base.sha }}"
          changed=$(git diff --name-status --diff-filter=MDR \
            "${{ github.event.pull_request.base.sha }}" HEAD -- supabase/migrations/)
          if [ -n "$changed" ]; then
            echo "$changed"
            echo "::error::This PR modifies, deletes or renames migrations that already exist on the base branch. 'supabase db push' identifies migrations by version and silently skips edited content, so production would never receive these changes. Write a new migration instead."
            exit 1
          fi

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Pinned, not latest: newer CLIs (2.110.0 observed) create the local DB
      # without table grants for anon/authenticated/service_role, so every
      # API query fails with "permission denied for table". 2.90.0 matches
      # the locally verified behavior.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.90.0

      # Full stack, not `db start`: the integration tests sign up real users,
      # so auth (and the REST API) must be up. Migrations apply on start.
      - name: Start local Supabase and apply all migrations
        run: supabase start

      - name: Integration tests (RLS, RPCs, triggers)
        run: pnpm --filter @planazo/integration-tests test

  deploy:
    name: Push migrations to production
    runs-on: ubuntu-latest
    # Merges to main only, and only after the same commit passed every test —
    # this is the one automated writer production has.
    needs: [checks, migrations]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.90.0

      # The access token alone is enough: link mints a login role for the
      # session pooler, no database password required (verified in a clean
      # container). `db push` applies only migrations missing from the remote
      # history table, so re-runs are no-ops.
      - name: Link to production
        run: supabase link --project-ref leszgvpjonzjclhbgzju

      - name: Push migrations
        run: supabase db push --yes
